[package]
name = "prova"
description = "Students practice tests right in the browser. Leptos (CSR) + WASM."
authors = ["BSŞ"]
license = "MIT"
version = "0.3.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "MouseEvent",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Response",
    "Storage",
    "UrlSearchParams",
    "Window",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
